[project]
name = "ha-device-interface"
version = "0.0.1"
description = "Control module for Home Assistant integration"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "redis>=5.1.1",
    "faststream[redis]>=0.5.30",
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "debugpy>=1.8.12",
    "common",
    "pydantic>=2.10.2",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_device_interface"]
