[project]
name = "common"
version = "0.0.1"
description = "Peripheral common components."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "influxdb-client>=1.46.0",
    "redis>=5.0.8",
    "pandas>=2.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
