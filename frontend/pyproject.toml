[project]
name = "frontend"
version = "0.0.1"
description = "Web Frontend for HEMS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.32.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "redis>=5.2.1",
    "jinja2>=3.1.2",
    "common",
]

[tool.uv.sources]
common = { path = "../common" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontend"]
