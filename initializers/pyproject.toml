[project]
name = "initializers"
version = "0.0.1"
description = "Initialize values for the user"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "influxdb-client>=1.38.0",
    "pandas>=2.1.1",
    "pymongo>=4.5.0",
    "pytz>=2023.3.post1",
    "pip-licenses>=4.3.4",
    "redis>=5.0.8",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "debugpy>=1.8.12",
    "common",
]

[tool.uv.sources]
common = { path = "../common" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/initializers"]