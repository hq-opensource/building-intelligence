[project]
name = "grid-services-api"
version = "0.0.1"
description = ""
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn>=0.32.1",
    "faststream[redis]>=0.5.30",
    "pydantic>=2.10.2",
    "python-dotenv>=1.0.1",
    "debugpy>=1.8.12",
    "common",
]

[tool.uv.sources]
common = { path = "../common" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grid_services_api"]
