[project]
name = "core-api"
version = "0.0.1"
description = "Peripheral main API."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "faststream[redis]>=0.5.23",
    "uvicorn>=0.30.6",
    "pandas>=2.2.3",
    "isodate>=0.7.2",
    "pyyaml>=6.0.2",
    "apscheduler>=3.11.0",
    "fastapi-mcp>=0.2.0",
    "python-dotenv>=1.0.1",
    "debugpy>=1.8.12",
    "influxdb-client>=1.46.0",
    "pytz>=2024.1",
    "pydantic>=2.0.0,<2.10.0",
]

[tool.uv.sources]
common = { path = "../common" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_api"]
